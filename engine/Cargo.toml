[package]
name = "ysob-engine"
version = "0.2.3"
edition = "2021"
description = "Shared agent engine: runtime, lanes, bells, breaker, todos"

[lib]
name = "ysob_engine"
path = "src/lib.rs"

[[bin]]
name = "ysob"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
getrandom = "0.2"
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
