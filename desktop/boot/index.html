<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You Son Of A Bitch</title>
<!-- The splash while the engine starts. The app shows the same picture until the squad has
     loaded, so the hand-over is seamless. The Rust shell writes an error into #msg if the
     engine won't start. -->
<style>
  @font-face { font-family: 'Pixel'; src: url('pixel.woff2') format('woff2'); font-weight: 700; font-display: block; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b08; color: #eceee6; font: 14px/1.5 system-ui, 'Segoe UI', sans-serif; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(60% 50% at 50% 42%, rgb(40 90 70 / 0.35), transparent 70%),
      radial-gradient(120% 90% at 50% 100%, #0d1a12, #070b08 60%);
    user-select: none;
    cursor: default;
  }
  .splash { display: grid; justify-items: center; gap: 0; animation: up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  @keyframes pulse { 50% { box-shadow: 0 0 26px 7px rgb(255 59 38 / 0.7), 0 0 2px #ff7b66; } }
  /* The arm-wrestle handshake, cut out; the arms run off the original crop, so the edges fade. */
  .shake {
    display: block;
    width: 208px;
    height: 208px;
    image-rendering: pixelated;
    -webkit-mask-image: linear-gradient(#000 60%, transparent 98%), linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(#000 60%, transparent 98%), linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
    mask-composite: intersect;
    filter: drop-shadow(0 10px 24px rgb(0 0 0 / 0.5));
    animation: grip 2.4s 0.6s ease-in-out infinite;
  }
  @keyframes grip { 50% { transform: translateY(-3px) rotate(-1deg); } }
  .shake.missing { display: none; }
  .dots { display: none; }
  .shake.missing + .dots { display: block; }
  .dots { position: relative; width: 30px; height: 26px; margin-top: 2px; }
  .dots i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #ff3b26; box-shadow: 0 0 8px 2px rgb(255 59 38 / 0.6); animation: pulse 1.6s ease-in-out infinite; }
  .dots i:nth-child(1) { left: 11px; top: 0; }
  .dots i:nth-child(2) { left: 0; top: 18px; animation-delay: 0.1s; }
  .dots i:nth-child(3) { left: 22px; top: 18px; animation-delay: 0.2s; }
  h1 {
    margin: 18px 0 0;
    font: 700 46px/1 'Pixel', system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-shadow: 0 3px 0 #0b120d, 0 0 30px rgb(255 140 60 / 0.18);
  }
  .tag { margin: 10px 0 0; color: #9ba393; font-size: 13.5px; letter-spacing: 0.01em; }
  .bar { position: relative; width: 220px; height: 3px; margin-top: 34px; border-radius: 2px; background: rgb(255 255 255 / 0.07); overflow: hidden; }
  .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, #7fd68f, transparent); animation: sweep 1.3s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #msg { min-height: 1.5em; margin-top: 14px; max-width: 36em; padding: 0 16px; text-align: center; white-space: pre-wrap; color: #7a8472; font-size: 12.5px; }
  .err .bar { display: none; }
  .acts { display: none; gap: 8px; margin-top: 16px; }
  .err .acts { display: flex; }
  .acts button { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font: 500 13px system-ui, 'Segoe UI', sans-serif; cursor: pointer; background: rgb(255 255 255 / 0.08); color: #eceee6; }
  .acts button:first-child { background: #eceee6; color: #0b0d0a; }
  .acts button:disabled { opacity: 0.5; cursor: default; }
  .err #msg { color: #ff9b8c; }
  @media (prefers-reduced-motion: reduce) { .splash, .shake, .dots i, .bar::after { animation: none !important; } }
</style>
</head>
<body>
  <main class="splash">
    <img class="shake" src="handshake.png" alt="">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>YSOB</h1>
    <p class="tag">Your AI agents are the squad. The bugs are the hunter.</p>
    <div class="bar" role="progressbar" aria-label="Starting"></div>
    <div id="msg" role="status">Waking the squad…</div>
    <div class="acts"><button type="button" id="retry">Try again</button><button type="button" id="log">Open the log</button></div>
  </main>
<script src="boot.js"></script>
</body>
</html>
